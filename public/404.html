<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Puslapis nerastas | MOTIVUS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f0e8;
        color: #0e1410;
        font-family: Figtree, system-ui, sans-serif;
        text-align: center;
      }
      .logo { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
      .logo span { color: #2b5a00; }
      h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1; letter-spacing: -.03em; margin: 28px 0 0; }
      p { margin-top: 16px; color: #434a41; font-size: 17px; line-height: 1.6; }
      .row { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px;
        border-radius: 999px; font-weight: 700; text-decoration: none; font-size: 15px;
      }
      .primary { background: #aeff3f; color: #0e1410; }
      .ghost { border: 1px solid rgba(14,20,16,.28); color: #0e1410; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">M<span>O</span>TIVUS</div>
      <h1>Puslapis nerastas</h1>
      <p>Tokio puslapio nėra arba jis buvo perkeltas.</p>
      <div class="row">
        <a class="primary" href="/">Į pagrindinį puslapį</a>
        <a class="ghost" href="tel:+37063222228">+370 632 22228</a>
      </div>
    </main>
  </body>
</html>
